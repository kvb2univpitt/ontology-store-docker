services:
  i2b2-data-demo:
    image: local/ontstore-i2b2-data-demo-postgresql:v1.8.3
    build:
      context: i2b2-data-demo/postgresql
      dockerfile: Dockerfile
    environment:
      - POSTGRES_PASSWORD=demouser
    container_name: i2b2-data-demo
    networks:
      - i2b2-demo-net
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U i2b2pm -d i2b2"]
      interval: 10s
      timeout: 10s
      retries: 5
  i2b2-core-server-demo:
    image: local/ontstore-i2b2-core-server-demo-postgresql:v1.8.3
    build:
      context: i2b2-core-server-demo/postgresql
      dockerfile: Dockerfile
    container_name: i2b2-core-server-demo
    networks:
      - i2b2-demo-net
    depends_on:
      i2b2-data-demo:
        condition: service_healthy
    ports:
      - 9090:9090
  i2b2-webclient-demo:
    image: local/ontstore-i2b2-webclient-demo:v1.8.3
    build:
      context: i2b2-webclient-demo
      dockerfile: Dockerfile
    container_name: i2b2-webclient-demo
    networks:
      - i2b2-demo-net
    depends_on:
      - i2b2-core-server-demo
    ports:
      - 80:80
networks:
  i2b2-demo-net:
    name: i2b2-demo-net
    driver: bridge
    external: true
